<div class="text-left px-6 gap-3 flex-col flex">
  <div class="relative overflow-hidden w-90 sm:w-full">
    <div
      class="absolute inset-y-1 right-0 left-0 w-full h-full z-20 transition-all duration-500 ease-in bg-sky-500 dark:bg-sky-600"
      [ngClass]="{ 'left-full': inView, 'left-0': !inView }"
      #projectSection
      id="project-section"
    ></div>
    <div
      class="flex flex-col gap-3 mb-3 items-center relative transition-opacity transform duration-500 ease-in-out delay-200"
      [ngClass]="{
        'opacity-100 translate-y-0': inView,
        'opacity-0 translate-y-20': !inView,
      }"
    >
      <h1 class="text-neutral-900 dark:text-neutral-50 text-3xl text-center">
        Projects
      </h1>
      <hr class="w-[30%]" />
    </div>
  </div>
  <app-project-entry
    *ngFor="let project of projects; index as projectIndex"
    [project]="project"
    [index]="projectIndex"
  />
</div>
